name: Build Negah Javan Android APK FINAL

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "NegahJavan-Android16-CLEAN-PROJECT.zip"
      - ".github/workflows/android-apk-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "Missing ANDROID_SIGNING_KEY secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q NegahJavan-Android16-CLEAN-PROJECT.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build unsigned release APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign APK with permanent key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 --decode > signing.jks
          UNSIGNED="project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing.jks \
            --ks-key-alias negahjavan \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:STORE_PASSWORD \
            --out NegahJavan-Android16.apk \
            aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs NegahJavan-Android16.apk
          rm -f signing.jks aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavan-Android16-APK
          path: NegahJavan-Android16.apk
          if-no-files-found: error
          retention-days: 14
