name: Build Negah Javan Android APK FINAL

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "NegahJavan-Android16-CLEAN-PROJECT.zip"
      - ".github/workflows/android-apk-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q NegahJavan-Android16-CLEAN-PROJECT.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          echo "Project extracted successfully"
          find project -maxdepth 3 -type f | sort

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" NegahJavan-Android16.apk
          ls -lh NegahJavan-Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavan-Android16-APK
          path: NegahJavan-Android16.apk
          if-no-files-found: error
          retention-days: 14
