name: Build Negah Javan APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "NegahJavan-Android16-CLEAN-PROJECT.zip"
      - ".github/workflows/android-apk-fixed.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q NegahJavan-Android16-CLEAN-PROJECT.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          echo "Android project extracted successfully."

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk NegahJavan-Android16.apk
          ls -lh NegahJavan-Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavan-Android16-APK
          path: NegahJavan-Android16.apk
          if-no-files-found: error
          retention-days: 14
