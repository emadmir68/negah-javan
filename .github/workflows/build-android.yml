name: Build Negah Javan Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q NegahJavan-Android16-CLEAN-PROJECT.zip -d project
          find project -maxdepth 3 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk NegahJavan-Android16.apk
          ls -lh NegahJavan-Android16.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavan-Android16-APK
          path: NegahJavan-Android16.apk
          if-no-files-found: error
